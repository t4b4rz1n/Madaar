# Include inside the shared Nginx http block. TLS terminates at ArvanCloud.
# Edge Nginx must share the external madar_network with this project's services.
# Any legacy routes to madar-api/madar-web must also use variable proxy_pass:
# a static upstream for the same hostname can override dynamic DNS resolution.
map $http_x_forwarded_proto $heledone_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name panel.heledone.com;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $heledone_web http://madar-web:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $heledone_forwarded_proto;

    # Keep old relative API clients functional during the transition.
    location /api/ {
        set $heledone_api http://madar-api:8000;
        proxy_pass $heledone_api;
    }

    location / {
        proxy_pass $heledone_web;
        proxy_http_version 1.1;
    }
}

server {
    listen 80;
    server_name api.heledone.com;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 100m;

    set $heledone_api http://madar-api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $heledone_forwarded_proto;

    location /static/ {
        set $heledone_web http://madar-web:80;
        rewrite ^/static/(.*)$ /api-static/$1 break;
        proxy_pass $heledone_web;
    }

    location /storage/madar-media/ {
        limit_except GET HEAD { deny all; }
        set $heledone_storage http://madar-minio:9000;
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass $heledone_storage;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass $heledone_api;
        proxy_http_version 1.1;
    }
}
