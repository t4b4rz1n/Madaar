name: Repository CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Copy .env.example to .env
        run: cp apps/api/.env.example apps/api/.env
      
      - run: docker compose config