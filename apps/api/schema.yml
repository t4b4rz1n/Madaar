components:
  schemas:
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        file:
          type: string
          format: uri
          pattern: (?:jpg|jpeg|png|gif|pdf|doc|docx|xls|xlsx|zip|rar|txt|csv)$
        created_at:
          type: string
          format: date-time
          readOnly: true
        file_type:
          type: string
          readOnly: true
      required:
      - created_at
      - file
      - file_type
      - id
    EntityTypeEnum:
      enum:
      - project
      - member
      - milestone
      - task
      type: string
      description: |-
        * `project` - Project
        * `member` - Member
        * `milestone` - Milestone
        * `task` - Task
    EventTypeEnum:
      enum:
      - project_created
      - project_updated
      - project_deleted
      - member_added
      - member_updated
      - member_removed
      - milestone_created
      - milestone_updated
      - milestone_completed
      - milestone_deleted
      - task_created
      - task_updated
      - task_completed
      type: string
      description: |-
        * `project_created` - Project created
        * `project_updated` - Project updated
        * `project_deleted` - Project deleted
        * `member_added` - Member added
        * `member_updated` - Member updated
        * `member_removed` - Member removed
        * `milestone_created` - Milestone created
        * `milestone_updated` - Milestone updated
        * `milestone_completed` - Milestone completed
        * `milestone_deleted` - Milestone deleted
        * `task_created` - Task created
        * `task_updated` - Task updated
        * `task_completed` - Task completed
    Feedback:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        subject:
          type: string
          maxLength: 255
        text:
          type: string
          title: Message Text
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - subject
      - text
    FeedbackRequest:
      type: object
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 255
        text:
          type: string
          minLength: 1
          title: Message Text
      required:
      - subject
      - text
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sender:
          allOf:
          - $ref: '#/components/schemas/message_sender_dashboard'
          readOnly: true
        text:
          type: string
          title: Message Text
        seen:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          readOnly: true
      required:
      - attachments
      - created_at
      - id
      - seen
      - sender
      - text
      - updated_at
    MessageCreate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        text:
          type: string
          title: Message Text
      required:
      - id
      - text
    MessageCreateRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          title: Message Text
        attachments:
          type: array
          items:
            type: string
            format: binary
          writeOnly: true
      required:
      - text
    Milestone:
      type: object
      description: |-
        Read/write serialiser for milestones.

        ``completed_at`` is managed by the service layer and is therefore
        read-only via the API.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        status:
          $ref: '#/components/schemas/MilestoneStatusEnum'
        status_display:
          type: string
          readOnly: true
        start_date:
          type: string
          format: date
          nullable: true
        target_date:
          type: string
          format: date
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        sequence:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Phase order
        weight:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Weight/Percentage of this milestone in overall project progress
            (e.g. 1 to 100)
        task_count:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - completed_at
      - created_at
      - id
      - project
      - status_display
      - target_date
      - task_count
      - title
      - updated_at
    MilestoneRequest:
      type: object
      description: |-
        Read/write serialiser for milestones.

        ``completed_at`` is managed by the service layer and is therefore
        read-only via the API.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        status:
          $ref: '#/components/schemas/MilestoneStatusEnum'
        start_date:
          type: string
          format: date
          nullable: true
        target_date:
          type: string
          format: date
        sequence:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Phase order
        weight:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Weight/Percentage of this milestone in overall project progress
            (e.g. 1 to 100)
      required:
      - target_date
      - title
    MilestoneStatusEnum:
      enum:
      - pending
      - in_progress
      - completed
      - cancelled
      type: string
      description: |-
        * `pending` - Pending
        * `in_progress` - In progress
        * `completed` - Completed
        * `cancelled` - Cancelled
    MyTokenObtainPairRequest:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        username:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        text:
          type: string
          readOnly: true
        link:
          type: string
          format: uri
          readOnly: true
          nullable: true
        seen:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - link
      - text
    NotificationRequest:
      type: object
      properties:
        seen:
          type: boolean
    OrganizationMinimal:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
